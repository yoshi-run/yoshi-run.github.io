<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台美股財報追蹤儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 12px;
      color: #334155;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header-card, .metric-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #0f172a;
    }
    .select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    select {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      outline: none;
      width: 100%;
      background-color: #f8fafc;
      font-weight: 600;
    }
    .unit-badge {
      display: inline-block;
      font-size: 12px;
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      color: #475569;
    }
    .metric-card h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    .chart-box {
      position: relative;
      height: 240px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 控制面板 -->
  <div class="header-card">
    <h1>📈 財報追蹤儀表板</h1>
    
    <div class="select-group">
      <label for="stockSelect" style="font-size:14px; font-weight:bold;">選擇查看股票：</label>
      <select id="stockSelect" onchange="updateCharts()"></select>
    </div>
    
    <div id="unitText" class="unit-badge">單位：--</div>
  </div>

  <!-- 指標 1：營業收入 Container -->
  <div class="metric-card">
    <h2>🔷 營業收入 (Revenue)</h2>
    <div class="chart-box">
      <canvas id="revenueChart"></canvas>
    </div>
  </div>

  <!-- 指標 2：稅後淨利 Container -->
  <div class="metric-card">
    <h2>🟢 稅後淨利 (Net Income)</h2>
    <div class="chart-box">
      <canvas id="netIncomeChart"></canvas>
    </div>
  </div>

  <!-- 指標 3：營業現金流 Container -->
  <div class="metric-card">
    <h2>📙 營業現金流 (Operating Cash Flow)</h2>
    <div class="chart-box">
      <canvas id="cashFlowChart"></canvas>
    </div>
  </div>

</div>

<script>
  let fullData = {};
  let charts = {};

  async function loadData() {
    try {
      // 加時間戳記強制避免快取
      const res = await fetch('stock_data.json?t=' + new Date().getTime());
      fullData = await res.json();
      renderDropdown();
      updateCharts();
    } catch (e) {
      console.error("載入 JSON 失敗:", e);
      alert("無法載入資料，請確認 stock_data.json 格式是否正確");
    }
  }

  function renderDropdown() {
    const select = document.getElementById('stockSelect');
    select.innerHTML = '';
    
    // 相容舊版與新版 JSON 結構
    const stocks = fullData.stocks || fullData;
    
    for (const key in stocks) {
      if (key === '_config') continue; // 排除設定檔
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = key;
      select.appendChild(opt);
    }
  }

  function createSingleChart(canvasId, title, labels, dataPoints, colorBg, colorBorder, unit) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    
    if (charts[canvasId]) {
      charts[canvasId].destroy();
    }

    charts[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: title,
          data: dataPoints,
          backgroundColor: colorBg,
          borderColor: colorBorder,
          borderWidth: 1.5,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => `${ctx.raw !== null ? ctx.raw.toLocaleString() : '無資料'} ${unit}`
            }
          }
        },
        scales: {
          y: {
            beginAtZero: false,
            grid: { color: '#f1f5f9' }
          },
          x: {
            grid: { display: false }
          }
        }
      }
    });
  }

  function updateCharts() {
    const selectedKey = document.getElementById('stockSelect').value;
    if (!selectedKey) return;

    // 相容新舊結構
    const stocks = fullData.stocks || fullData;
    const stock = stocks[selectedKey];
    if (!stock) return;

    const financials = stock.financials || [];

    document.getElementById('unitText').textContent = `單位：${stock.unit || ''}`;

    const dates = financials.map(f => f.date);
    const revenues = financials.map(f => f.revenue);
    const netIncomes = financials.map(f => f.net_income);
    const cashFlows = financials.map(f => f.operating_cash_flow);

    // 渲染三張柱狀圖
    createSingleChart('revenueChart', '營業收入', dates, revenues, 'rgba(37, 99, 235, 0.75)', '#1d4ed8', stock.unit);
    createSingleChart('netIncomeChart', '稅後淨利', dates, netIncomes, 'rgba(16, 185, 129, 0.75)', '#047857', stock.unit);
    createSingleChart('cashFlowChart', '營業現金流', dates, cashFlows, 'rgba(245, 158, 11, 0.75)', '#b45309', stock.unit);
  }

  loadData();
</script>

</body>
</html>
