<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>台美股季度財報追蹤儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    select { padding: 8px; font-size: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📈 台美股季度財報追蹤儀表板</h2>
    <label for="stockSelect">選擇股票：</label>
    <select id="stockSelect" onchange="updateChart()"></select>
    
    <canvas id="financialChart" width="400" height="200"></canvas>
  </div>

  <script>
    let stockData = {};
    let chartInstance = null;

    // 讀取產出的 JSON 數據
    fetch('stock_data.json')
      .then(res => res.json())
      .then(data => {
        stockData = data;
        const select = document.getElementById('stockSelect');
        Object.keys(data).forEach(symbol => {
          let opt = document.createElement('option');
          opt.value = symbol;
          opt.innerHTML = symbol + ` (${data[symbol].type})`;
          select.appendChild(opt);
        });
        updateChart();
      });

    function updateChart() {
      const symbol = document.getElementById('stockSelect').value;
      const financials = stockData[symbol].financials.reverse(); // 依照時間正序
      
      const labels = financials.map(item => item.date);
      const revenue = financials.map(item => item.revenue);
      const netIncome = financials.map(item => item.net_income);
      const cashFlow = financials.map(item => item.operating_cash_flow);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('financialChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: '營業收入', data: revenue, backgroundColor: 'rgba(54, 162, 235, 0.6)' },
            { label: '稅後淨利', data: netIncome, backgroundColor: 'rgba(75, 192, 192, 0.6)' },
            { label: '營業現金流', data: cashFlow, backgroundColor: 'rgba(255, 159, 64, 0.6)' }
          ]
        },
        options: {
          responsive: true,
          plugins: { title: { display: true, text: `${symbol} 近 4 季重要財務指標` } }
        }
      });
    }
  </script>
</body>
</html>
