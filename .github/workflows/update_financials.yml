name: Update Stock Financials Data

on:
  schedule:
    # Cron 語法：每天 UTC 時間 00:00 (相當於台灣時間上午 08:00) 定時執行
    - cron: '0 0 * * *'
  # 支援手動觸發執行 (方便測試與隨時手動更新)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. 簽出專案程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝必要的 Python 套件
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      # 4. 執行抓取財報並產生 stock_data.json 的 Python 腳本
      - name: Run Financial Fetcher Script
        run: |
          python fetch_data.py

      # 5. 自動將更新後的 stock_data.json Commit 並 Push 回儲存庫
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update financial data [skip ci]" && git push)
